services:
  # Docker named volumes are commonly created as root-owned. This one-shot
  # initializer scopes the ownership change to the dedicated data volume; the
  # application container itself still runs as the unprivileged `finale` user.
  # Backup/restore commands also run this service through `docker compose run`
  # so Compose resolves the real project-scoped volume name automatically.
  init-data:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 1001:1001 /data"]
    volumes:
      - finale-data:/data
    restart: "no"

  finale-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: finale-revision-agent:local
    init: true
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      # Loopback is the safe default because this single-user runtime has no
      # authentication. Put an HTTPS reverse proxy in front before changing it.
      - "${FINALE_BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      FINALE_DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_ALLOW_UNAUTHENTICATED_SERVER_KEY: ${AI_ALLOW_UNAUTHENTICATED_SERVER_KEY:-false}
      AI_ALLOW_CUSTOM_BASE_URL: ${AI_ALLOW_CUSTOM_BASE_URL:-false}
      FINALE_ALLOWED_ORIGINS: ${FINALE_ALLOWED_ORIGINS:-}
      FINALE_TRUST_PROXY: ${FINALE_TRUST_PROXY:-false}
      EMAIL_PROVIDER_URL: ${EMAIL_PROVIDER_URL:-}
      EMAIL_PROVIDER_TOKEN: ${EMAIL_PROVIDER_TOKEN:-}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:-}
      SCHOOL_EMAIL_DOMAINS: ${SCHOOL_EMAIL_DOMAINS:-}
      COMMUNITY_ADMIN_TOKEN: ${COMMUNITY_ADMIN_TOKEN:-}
      FINALE_RATE_LIMIT_DISABLED: ${FINALE_RATE_LIMIT_DISABLED:-false}
      FINALE_MAX_UPLOAD_BYTES: ${FINALE_MAX_UPLOAD_BYTES:-}
      FINALE_AI_CONCURRENCY: ${FINALE_AI_CONCURRENCY:-1}
    volumes:
      - finale-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  # 只读挂载数据卷，定期打一份 tar。不停止应用，适合单机崩溃一致性备份。
  # 每次备份都会校验归档可解压且包含非空的 workspace.json，并按 FINALE_BACKUP_KEEP 清理旧备份。
  backup:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      finale-agent:
        condition: service_started
    environment:
      BACKUP_INTERVAL_SECONDS: ${FINALE_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${FINALE_BACKUP_KEEP:-14}
    volumes:
      - finale-data:/data:ro
      - finale-backups:/backup
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /backup
        while true; do
          name="finale-data-$$(date -u +%Y%m%dT%H%M%SZ).tgz"
          tar -czf "/backup/$$name" -C /data .
          if ! tar -tzf "/backup/$$name" | grep -qx "./workspace.json"; then
            echo "backup is missing workspace.json; keeping the archive for inspection" >&2
          else
            sha256sum "/backup/$$name" > "/backup/$$name.sha256"
            echo "wrote /backup/$$name"
          fi
          keep="$${BACKUP_KEEP:-14}"
          if [ "$$keep" -gt 0 ] 2>/dev/null; then
            ls -1t /backup/finale-data-*.tgz 2>/dev/null | tail -n +$$((keep + 1)) | while IFS= read -r stale; do
              rm -f "$$stale" "$$stale.sha256"
              echo "pruned $$stale"
            done
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done

volumes:
  finale-data:
  finale-backups:
